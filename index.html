<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautuluxe Nail Spa - Turn Tracking & Management</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Playfair Display, Inter & Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <!-- React & ReactDOM CDN (Production Version tối ưu tốc độ) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            spa: {
              bg: '#F8F3F0',
              card: '#FAF6F3',
              cardBorder: '#E8DDD5',
              textMain: '#382E2B',
              textMuted: '#857871',
              sidebarBg: '#F1E7DF',
              purpleAdd: '#8E718E',
              purpleHover: '#775A77',
              greenCall: '#3B604A',
              greenHover: '#2C4938',
              goldNum: '#C29F71',
              goldBadge: '#BB9869',
              goldHover: '#A18052',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            handwritten: ['"Caveat"', 'cursive'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #F8F3F0 0%, #F3ECE6 100%);
      color: #382E2B;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .smooth-scroll {
      -webkit-overflow-scrolling: touch;
      will-change: scroll-position;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #F8F3F0; }
    ::-webkit-scrollbar-thumb { background: #DBCFC5; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen selection:bg-spa-purpleAdd selection:text-white">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAN1beWGmS1lzgyyx-RHWwB5vro3GfrI_Q",
      authDomain: "turntracker-1ab68.firebaseapp.com",
      projectId: "turntracker-1ab68",
      storageBucket: "turntracker-1ab68.firebasestorage.app",
      messagingSenderId: "537033521288",
      appId: "1:537033521288:web:ed42fa5013efe85695073d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const STORAGE_KEY = "nail-salon-call-system-v4";
    const STATE_REF = db.collection("nailSalon").doc("board");
    const ARCHIVE_COLLECTION = "nailSalonArchive";

    const INITIAL_TECHNICIANS = [
      { id: "dee", name: "Dee" },
      { id: "tony", name: "Tony" },
      { id: "lee", name: "Lee" },
      { id: "barry", name: "Barry" },
      { id: "leon", name: "Leon" },
    ];

    function todayString() {
      const date = new Date();
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function createInitialData() {
      return {
        technicians: INITIAL_TECHNICIANS,
        standby: [],
        turnPosition: [],
        starredIds: [],
        history: [],
        standbyVisible: true,
        businessDate: todayString(),
      };
    }

    function normalize(data) {
      const initial = createInitialData();
      const d = data || {};
      return {
        ...initial,
        ...d,
        technicians: Array.isArray(d.technicians) ? d.technicians : initial.technicians,
        standby: Array.isArray(d.standby) ? d.standby : [],
        turnPosition: Array.isArray(d.turnPosition) ? d.turnPosition : [],
        starredIds: Array.isArray(d.starredIds) ? d.starredIds : [],
        history: Array.isArray(d.history) ? d.history : [],
      };
    }

    function moveItem(list, index, direction) {
      const result = [...list];
      const destination = index + direction;
      if (destination < 0 || destination >= result.length) return result;
      [result[index], result[destination]] = [result[destination], result[index]];
      return result;
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString();
    }

    function App() {
      const [data, setBoard] = useState(createInitialData());
      const [archive, setArchive] = useState([]);
      const [syncError, setSyncError] = useState(false);
      const [newName, setNewName] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [editingId, setEditingId] = useState(null);
      const [editingName, setEditingName] = useState("");
      const [editingOrder, setEditingOrder] = useState(false);
      const [confirmNewDay, setConfirmNewDay] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [showArchiveModal, setShowArchiveModal] = useState(false);
      const [activeNav, setActiveNav] = useState("home");
      const [message, setMessage] = useState("");

      // Sử dụng ref để lưu trữ state mới nhất tránh bị closure stale khi gọi transaction liên tục
      const dataRef = useRef(data);
      dataRef.current = data;

      useEffect(() => {
        const stopBoard = STATE_REF.onSnapshot(
          (snap) => {
            if (snap.exists) {
              setBoard(normalize(snap.data()));
            } else {
              // Khởi tạo dữ liệu mặc định nếu chưa có trên Firestore
              const initial = createInitialData();
              STATE_REF.set(initial);
              setBoard(initial);
            }
            setSyncError(false);
          },
          (error) => {
            console.error("Firebase sync error:", error);
            setSyncError(true);
          }
        );

        const stopArchive = db.collection(ARCHIVE_COLLECTION).orderBy("createdAt", "desc").limit(10).onSnapshot(
          (snap) => setArchive(snap.docs.map((item) => item.data())),
          (error) => console.error("Archive error:", error)
        );

        return () => { stopBoard(); stopArchive(); };
      }, []);

      // Tối ưu hàm cập nhật state lên Firestore mượt mà hơn bằng set trực tiếp kết hợp local update
      const setData = useCallback((updater) => {
        const nextData = typeof updater === "function" ? updater(dataRef.current) : updater;
        setBoard(nextData); // Cập nhật UI ngay lập tức (Optimistic UI update) không có độ trễ

        STATE_REF.set(nextData).catch((error) => {
          console.error("Error saving data:", error);
          setSyncError(true);
        });
      }, []);

      const notify = useCallback((text) => {
        setMessage(text);
        window.setTimeout(() => setMessage(""), 2500);
      }, []);

      const getTechnician = useCallback((id, technicians = dataRef.current.technicians) => {
        return technicians.find((tech) => tech.id === id);
      }, []);

      const addTechnician = useCallback((event) => {
        if (event) event.preventDefault();
        const name = newName.trim();
        if (!name) return notify("Please enter a technician name.");
        if (dataRef.current.technicians.some((tech) => tech.name.toLowerCase() === name.toLowerCase())) {
          return notify("This technician already exists.");
        }
        const id = "tech-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
        setData((previous) => ({
          ...previous,
          technicians: [...previous.technicians, { id, name }],
        }));
        setNewName("");
        notify(`${name} added.`);
      }, [newName, setData, notify]);

      const saveTechnicianName = useCallback((id) => {
        const name = editingName.trim();
        if (!name) return notify("Name cannot be empty.");
        setData((previous) => ({
          ...previous,
          technicians: previous.technicians.map((tech) => (tech.id === id ? { ...tech, name } : tech)),
        }));
        setEditingId(null);
        setEditingName("");
        notify("Technician name updated.");
      }, [editingName, setData, notify]);

      const deleteTechnician = useCallback((id) => {
        const tech = getTechnician(id);
        if (!tech || !window.confirm(`Remove ${tech.name}?`)) return;

        setData((previous) => ({
          ...previous,
          technicians: previous.technicians.filter((t) => t.id !== id),
          standby: previous.standby.filter((item) => item !== id),
          turnPosition: previous.turnPosition.filter((item) => item !== id),
          starredIds: previous.starredIds.filter((item) => item !== id),
        }));
        setEditingId(null);
        notify(`${tech.name} removed.`);
      }, [getTechnician, setData, notify]);

      const addToStandby = useCallback((id) => {
        if (dataRef.current.standby.includes(id)) return notify("Already in Standby.");
        setData((previous) => ({ ...previous, standby: [...previous.standby, id] }));
        notify("Added to Standby.");
      }, [setData, notify]);

      const removeFromStandby = useCallback((id) => {
        setData((previous) => ({ ...previous, standby: previous.standby.filter((item) => item !== id) }));
      }, [setData]);

      const moveStandby = useCallback((index, direction) => {
        setData((previous) => ({ ...previous, standby: moveItem(previous.standby, index, direction) }));
      }, [setData]);

      const toggleStar = useCallback((id) => {
        setData((previous) => ({
          ...previous,
          starredIds: previous.starredIds.includes(id)
            ? previous.starredIds.filter((item) => item !== id)
            : [...previous.starredIds, id],
        }));
      }, [setData]);

      const callTechnician = useCallback((id) => {
        const tech = getTechnician(id);
        if (!tech) return notify("Technician not found.");

        setData((previous) => {
          const beforePosition = [...previous.turnPosition];
          const currentPosition = previous.turnPosition.filter((item) => item !== id);
          const nextPosition = [...currentPosition, id];
          const timestamp = new Date().toISOString();

          return {
            ...previous,
            turnPosition: nextPosition,
            history: [...previous.history, {
              id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
              techId: id,
              techName: tech.name,
              turnNo: previous.history.length + 1,
              timestamp,
              beforePosition,
            }],
            standby: previous.standby.filter((item) => item !== id),
          };
        });
        notify(`${tech.name} called.`);
      }, [getTechnician, setData, notify]);

      const moveTurnPosition = useCallback((index, direction) => {
        setData((previous) => ({ ...previous, turnPosition: moveItem(previous.turnPosition, index, direction) }));
      }, [setData]);

      const undoLastCall = useCallback(() => {
        if (!dataRef.current.history.length) return notify("There is no call to undo.");
        const lastName = dataRef.current.history[dataRef.current.history.length - 1].techName;

        setData((previous) => {
          const lastEntry = previous.history[previous.history.length - 1];
          if (!lastEntry) return previous;
          return {
            ...previous,
            history: previous.history.slice(0, -1),
            turnPosition: Array.isArray(lastEntry.beforePosition)
              ? lastEntry.beforePosition.filter((id) => previous.technicians.some((tech) => tech.id === id))
              : previous.turnPosition,
          };
        });
        notify(`Last call for ${lastName} undone.`);
      }, [setData, notify]);

      const startNewDay = useCallback(() => {
        const previous = dataRef.current;
        if (previous.history.length > 0) {
          const archiveId = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
          db.collection(ARCHIVE_COLLECTION).doc(archiveId).set({
            id: archiveId,
            date: previous.businessDate,
            history: previous.history,
            createdAt: Date.now(),
          });
        }

        const resetData = {
          ...previous,
          history: [],
          standby: [],
          turnPosition: [],
          starredIds: [],
          standbyVisible: true,
          businessDate: todayString(),
        };

        setData(resetData);
        setEditingOrder(false);
        setConfirmNewDay(false);
        notify("New day started.");
      }, [setData, notify]);

      const availableForStandby = useMemo(() => data.technicians.filter((tech) => !data.standby.includes(tech.id)), [data.technicians, data.standby]);
      const activeStandbyTechnicians = useMemo(() => data.standby.map((id) => getTechnician(id, data.technicians)).filter(Boolean), [data.standby, data.technicians, getTechnician]);
      const activeTurnTechnicians = useMemo(() => data.turnPosition.map((id) => getTechnician(id, data.technicians)).filter(Boolean), [data.turnPosition, data.technicians, getTechnician]);
      const starredInTurn = useMemo(() => activeTurnTechnicians.filter((tech) => data.starredIds.includes(tech.id)), [activeTurnTechnicians, data.starredIds]);

      const filteredTechnicians = useMemo(() => {
        if (!searchQuery.trim()) return data.technicians;
        return data.technicians.filter(t => t.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }, [data.technicians, searchQuery]);

      return e("div", { class: "min-h-screen bg-spa-bg flex flex-col" },
        
        /* TOP HEADER BAR */
        e("header", { class: "bg-spa-card/95 backdrop-blur-md border-b border-spa-cardBorder px-4 sm:px-6 py-3 flex items-center justify-between sticky top-0 z-40" },
          e("div", { class: "flex items-center gap-4" },
            e("div", { class: "flex items-center gap-3" },
              e("div", { class: "text-spa-goldBadge text-2xl" }, e("i", { class: "fa-solid fa-spa" })),
              e("div", null,
                e("h1", { class: "font-serif font-bold text-xl sm:text-2xl text-spa-textMain leading-tight" }, "Beautuluxe Nail Spa"),
                e("p", { class: "text-[10px] uppercase tracking-widest text-spa-textMuted font-semibold" }, "TURN TRACKING & MANAGEMENT")
              )
            )
          ),

          e("div", { class: "flex items-center gap-3" },
            e("div", { class: "flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white border border-spa-cardBorder text-xs text-spa-textMuted shadow-xs" },
              e("i", { class: "fa-regular fa-calendar text-spa-textMuted" }),
              e("span", null, "Date: ", e("strong", { class: "text-spa-textMain font-semibold ml-0.5" }, data.businessDate))
            ),
            e("div", { class: `flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold ${syncError ? 'bg-rose-50 border border-rose-200 text-rose-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700'}` },
              e("span", { class: `w-2 h-2 rounded-full ${syncError ? 'bg-rose-500' : 'bg-emerald-500 animate-pulse'}` }),
              syncError ? "Offline/Sync Error" : "Live"
            )
          )
        ),

        /* APP LAYOUT WITH SIDEBAR */
        e("div", { class: "flex-1 flex" },
          
          /* LEFT SIDEBAR NAVIGATION */
          e("aside", { class: "w-48 bg-spa-sidebarBg/60 border-r border-spa-cardBorder p-4 hidden md:flex flex-col justify-between relative overflow-hidden" },
            e("nav", { class: "space-y-1.5 z-10" },
              e("button", {
                onClick: () => setActiveNav("home"),
                class: `w-full px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-3 transition cursor-pointer ${
                  activeNav === "home" ? "bg-spa-purpleAdd text-white shadow-sm" : "text-spa-textMain hover:bg-spa-bg"
                }`
              }, e("i", { class: "fa-solid fa-house text-xs" }), "Home"),

              e("button", {
                onClick: () => setShowHistoryModal(true),
                class: "w-full px-3.5 py-2.5 rounded-xl text-xs font-semibold text-spa-textMain hover:bg-spa-bg flex items-center gap-3 transition cursor-pointer"
              }, e("i", { class: "fa-regular fa-clock text-xs" }), "Turn History"),

              e("button", {
                onClick: () => setShowArchiveModal(true),
                class: "w-full px-3.5 py-2.5 rounded-xl text-xs font-semibold text-spa-textMain hover:bg-spa-bg flex items-center gap-3 transition cursor-pointer"
              }, e("i", { class: "fa-solid fa-box-archive text-xs" }), "Archive")
            ),

            e("div", { class: "pt-6 border-t border-spa-cardBorder/60 relative z-10" },
              e("div", { class: "font-handwritten text-2xl text-spa-purpleAdd font-bold leading-tight" },
                "Better Nails", e("br"), "Happier You ♥"
              )
            )
          ),

          /* MAIN DASHBOARD CONTENT */
          e("main", { class: "flex-1 p-4 sm:p-6 space-y-5 max-w-7xl mx-auto w-full" },
            
            message && e("div", { class: "p-3 bg-spa-textMain text-white text-xs sm:text-sm rounded-xl shadow-md flex items-center justify-between" },
              e("span", { class: "flex items-center gap-2" }, e("i", { class: "fa-solid fa-circle-check text-spa-goldBadge" }), message)
            ),

            /* STATS ROW */
            e("div", { class: "grid grid-cols-1 lg:grid-cols-12 gap-4 items-center" },
              e("div", { class: "lg:col-span-7 bg-gradient-to-r from-pink-100/80 via-purple-100/60 to-pink-50/80 border border-spa-cardBorder rounded-3xl p-5 flex items-center justify-between shadow-xs min-h-[95px]" },
                e("div", { class: "z-10 space-y-0.5" },
                  e("h2", { class: "font-handwritten text-3xl sm:text-4xl font-bold text-spa-purpleAdd tracking-wide" }, "Good Morning!"),
                  e("p", { class: "text-xs font-semibold text-spa-textMuted" }, "Perfect nails, better mood. ♥")
                ),
                e("div", { class: "text-spa-purpleAdd/30 text-6xl flex items-center gap-3 pr-2" },
                  e("i", { class: "fa-solid fa-spa" })
                )
              ),

              e("div", { class: "lg:col-span-5 grid grid-cols-2 sm:grid-cols-4 gap-2.5" },
                e("div", { class: "bg-spa-card border border-spa-cardBorder p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs" },
                  e("span", { class: "font-serif text-lg font-bold text-spa-textMain" }, data.technicians.length),
                  e("span", { class: "text-[10px] text-spa-textMuted" }, "Nail Techs")
                ),
                e("div", { class: "bg-spa-card border border-spa-cardBorder p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs" },
                  e("span", { class: "font-serif text-lg font-bold text-spa-textMain" }, data.standby.length),
                  e("span", { class: "text-[10px] text-spa-textMuted" }, "Standby")
                ),
                e("div", { class: "bg-spa-card border border-spa-cardBorder p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs" },
                  e("span", { class: "font-serif text-lg font-bold text-spa-textMain" }, data.turnPosition.length),
                  e("span", { class: "text-[10px] text-spa-textMuted" }, "Active Turns")
                ),
                e("div", { class: "bg-spa-card border border-spa-cardBorder p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs" },
                  e("span", { class: "font-serif text-lg font-bold text-spa-textMain" }, data.history.length),
                  e("span", { class: "text-[10px] text-spa-textMuted" }, "Calls Today")
                )
              )
            ),

            /* MAIN GRID */
            e("div", { class: "grid grid-cols-1 lg:grid-cols-12 gap-5 items-start" },
              
              /* LEFT COLUMN: TECHS & STANDBY */
              e("div", { class: "lg:col-span-7 space-y-5" },
                
                /* NAIL TECHS SECTION */
                e("section", { class: "bg-spa-card rounded-3xl p-5 border border-spa-cardBorder shadow-xs" },
                  e("div", { class: "flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-spa-cardBorder" },
                    e("div", { class: "flex items-center gap-2.5" },
                      e("div", { class: "w-8 h-8 rounded-full bg-spa-purpleAdd/20 text-spa-purpleAdd flex items-center justify-center text-sm" }, e("i", { class: "fa-solid fa-users" })),
                      e("div", null,
                        e("h3", { class: "font-serif text-lg font-bold text-spa-textMain" }, "Nail Techs"),
                        e("p", { class: "text-[11px] text-spa-textMuted" }, "Manage technicians list.")
                      )
                    ),
                    e("div", { class: "flex items-center gap-2" },
                      e("input", {
                        type: "text",
                        value: searchQuery,
                        onChange: (evt) => setSearchQuery(evt.target.value),
                        placeholder: "Search tech...",
                        class: "w-36 bg-white border border-spa-cardBorder rounded-xl px-3 py-1.5 text-xs outline-none focus:border-spa-purpleAdd"
                      }),
                      e("button", {
                        onClick: () => {
                          const name = prompt("Enter new technician name:");
                          if (name && name.trim()) {
                            setNewName(name);
                            setTimeout(() => addTechnician(), 50);
                          }
                        },
                        class: "bg-spa-purpleAdd hover:bg-spa-purpleAdd/90 text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 cursor-pointer"
                      }, e("i", { class: "fa-solid fa-plus text-[10px]" }), "Add")
                    )
                  ),

                  e("div", { class: "my-3 space-y-2 max-h-[260px] overflow-y-auto pr-1 smooth-scroll" },
                    filteredTechnicians.length === 0
                      ? e("div", { class: "p-6 text-center text-xs text-spa-textMuted italic bg-spa-bg/40 rounded-2xl" }, "No technicians found.")
                      : filteredTechnicians.map((tech) =>
                          e("div", { key: tech.id, class: "p-3 bg-white border border-spa-cardBorder rounded-2xl flex items-center justify-between gap-3" },
                            editingId === tech.id
                              ? e("div", { class: "flex items-center gap-2 w-full" },
                                  e("input", {
                                    type: "text",
                                    value: editingName,
                                    onChange: (evt) => setEditingName(evt.target.value),
                                    class: "flex-1 bg-white border border-spa-purpleAdd rounded-lg px-2.5 py-1 text-xs font-semibold outline-none"
                                  }),
                                  e("button", { onClick: () => saveTechnicianName(tech.id), class: "px-2.5 py-1 bg-spa-purpleAdd text-white text-xs font-bold rounded-lg" }, "Save"),
                                  e("button", { onClick: () => setEditingId(null), class: "px-2.5 py-1 bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg" }, "Cancel")
                                )
                              : e(React.Fragment, null,
                                  e("div", { class: "flex items-center gap-3" },
                                    e("div", { class: "w-8 h-8 rounded-full bg-spa-purpleAdd/15 text-spa-purpleAdd font-bold text-xs flex items-center justify-center border border-spa-cardBorder" },
                                      tech.name.charAt(0).toUpperCase()
                                    ),
                                    e("span", { class: "font-bold text-spa-textMain text-sm" }, tech.name)
                                  ),
                                  e("div", { class: "flex items-center gap-1.5" },
                                    e("button", {
                                      onClick: () => callTechnician(tech.id),
                                      class: "bg-spa-greenCall hover:bg-spa-greenHover text-white px-3.5 py-1.5 rounded-xl text-xs font-bold uppercase tracking-wider transition flex items-center gap-1 cursor-pointer"
                                    }, e("i", { class: "fa-solid fa-phone text-[9px]" }), "CALL"),
                                    e("button", {
                                      onClick: () => { setEditingId(tech.id); setEditingName(tech.name); },
                                      class: "w-7 h-7 rounded-full bg-white border border-spa-cardBorder text-spa-textMuted text-xs flex items-center justify-center cursor-pointer"
                                    }, e("i", { class: "fa-solid fa-pen text-[10px]" })),
                                    e("button", {
                                      onClick: () => deleteTechnician(tech.id),
                                      class: "w-7 h-7 rounded-full bg-white border border-spa-cardBorder text-rose-500 text-xs flex items-center justify-center cursor-pointer"
                                    }, e("i", { class: "fa-solid fa-trash-can text-[10px]" }))
                                  )
                                )
                          )
                        )
                  )
                ),

                /* STANDBY SECTION */
                e("section", { class: "bg-spa-card rounded-3xl p-5 border border-spa-cardBorder shadow-xs" },
                  e("div", { class: "flex items-center justify-between pb-3 border-b border-spa-cardBorder" },
                    e("div", { class: "flex items-center gap-2.5" },
                      e("div", { class: "w-8 h-8 rounded-full bg-spa-greenCall/15 text-spa-greenCall flex items-center justify-center text-sm" }, e("i", { class: "fa-solid fa-user-group" })),
                      e("div", null,
                        e("h3", { class: "font-serif text-lg font-bold text-spa-textMain" }, "Standby"),
                        e("p", { class: "text-[11px] text-spa-textMuted" }, "Waiting queue.")
                      )
                    ),
                    e("button", {
                      onClick: () => setData((prev) => ({ ...prev, standby: [] })),
                      class: "px-3 py-1 rounded-full border border-spa-cardBorder bg-white text-xs font-semibold text-spa-textMuted hover:text-spa-textMain cursor-pointer"
                    }, "Clear")
                  ),

                  e("div", { class: "mt-3 space-y-3" },
                    activeStandbyTechnicians.length === 0
                      ? e("div", { class: "p-4 text-center text-xs text-spa-textMuted italic bg-spa-bg/40 rounded-2xl" }, "Standby queue is empty.")
                      : e("div", { class: "space-y-2 max-h-[200px] overflow-y-auto pr-1 smooth-scroll" },
                          activeStandbyTechnicians.map((tech, index) =>
                            e("div", { key: tech.id, class: "p-2.5 bg-white border border-spa-cardBorder rounded-2xl flex items-center justify-between gap-3" },
                              e("div", { class: "flex items-center gap-3" },
                                e("div", { class: "w-7 h-7 rounded-full bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center justify-center" }, index + 1),
                                e("span", { class: "font-bold text-spa-textMain text-sm" }, tech.name)
                              ),
                              e("div", { class: "flex items-center gap-1.5" },
                                e("button", {
                                  disabled: index === 0,
                                  onClick: () => moveStandby(index, -1),
                                  class: "w-6 h-6 rounded bg-spa-bg border border-spa-cardBorder text-[10px] font-bold disabled:opacity-30 cursor-pointer"
                                }, "↑"),
                                e("button", {
                                  disabled: index === activeStandbyTechnicians.length - 1,
                                  onClick: () => moveStandby(index, 1),
                                  class: "w-6 h-6 rounded bg-spa-bg border border-spa-cardBorder text-[10px] font-bold disabled:opacity-30 cursor-pointer"
                                }, "↓"),
                                e("button", {
                                  onClick: () => callTechnician(tech.id),
                                  class: "bg-spa-greenCall text-white px-3 py-1 rounded-xl text-xs font-bold uppercase transition flex items-center gap-1 cursor-pointer"
                                }, e("i", { class: "fa-solid fa-phone text-[9px]" }), "CALL"),
                                e("button", {
                                  onClick: () => removeFromStandby(tech.id),
                                  class: "w-6 h-6 rounded-full bg-spa-bg text-rose-500 text-xs flex items-center justify-center cursor-pointer"
                                }, e("i", { class: "fa-solid fa-trash-can text-[10px]" }))
                              )
                            )
                          )
                        ),

                    availableForStandby.length > 0 && e("div", { class: "pt-2 border-t border-spa-cardBorder" },
                      e("p", { class: "text-[10px] text-spa-textMuted mb-1.5 font-medium" }, "Add to Standby:"),
                      e("div", { class: "flex flex-wrap gap-1.5" },
                        availableForStandby.map((tech) =>
                          e("button", {
                            key: tech.id,
                            onClick: () => addToStandby(tech.id),
                            class: "px-2.5 py-1 bg-white hover:bg-spa-bg border border-spa-cardBorder rounded-xl text-xs font-semibold text-spa-textMain transition cursor-pointer"
                          }, `+ ${tech.name}`)
                        )
                      )
                    )
                  )
                )
              ),

              /* RIGHT COLUMN: LIVE TURN POSITION */
              e("div", { class: "lg:col-span-5 space-y-5" },
                e("section", { class: "bg-spa-card rounded-3xl p-5 border border-spa-cardBorder shadow-xs min-h-[500px] flex flex-col justify-between" },
                  e("div", null,
                    e("div", { class: "flex items-center justify-between pb-3 border-b border-spa-cardBorder" },
                      e("div", { class: "flex items-center gap-2.5" },
                        e("div", { class: "w-8 h-8 rounded-full bg-spa-goldBadge/20 text-spa-goldBadge flex items-center justify-center text-sm" }, e("i", { class: "fa-solid fa-crown" })),
                        e("div", null,
                          e("h3", { class: "font-serif text-lg font-bold text-spa-textMain" }, "Live Turn Position"),
                          e("p", { class: "text-[11px] text-spa-textMuted" }, "Active service queue.")
                        )
                      ),
                      e("button", {
                        onClick: () => setEditingOrder(!editingOrder),
                        class: `px-3 py-1 rounded-full border border-spa-cardBorder text-xs font-semibold transition cursor-pointer ${
                          editingOrder ? "bg-spa-goldBadge text-white" : "bg-white text-spa-textMain"
                        }`
                      }, editingOrder ? "Done" : "Reorder")
                    ),

                    starredInTurn.length > 0 && e("div", { class: "my-3 p-3 rounded-2xl bg-amber-500/10 border border-spa-goldBadge text-center" },
                      e("div", { class: "text-spa-goldBadge text-[11px] font-bold uppercase mb-0.5" }, "★ Priority Notice"),
                      e("div", { class: "font-serif text-lg font-bold text-spa-textMain" }, starredInTurn.map((t) => t.name).join(", "))
                    ),

                    activeTurnTechnicians.length === 0
                      ? e("div", { class: "my-6 p-8 text-center bg-white/60 rounded-2xl border border-dashed border-spa-cardBorder text-xs text-spa-textMuted" },
                          "Turn Position Empty. Press CALL to dispatch."
                        )
                      : e("div", { class: "my-3 flex flex-col gap-2.5 w-full max-h-[400px] overflow-y-auto pr-1 smooth-scroll" },
                          activeTurnTechnicians.map((tech, index) => {
                            const isStarred = data.starredIds.includes(tech.id);
                            return e("div", {
                              key: tech.id,
                              class: `w-full p-3.5 rounded-2xl border transition flex items-center justify-between gap-3 ${
                                isStarred ? "bg-amber-500/10 border-spa-goldBadge shadow-xs" : "bg-white border-spa-cardBorder"
                              }`
                            },
                              e("div", { class: "flex items-center gap-3" },
                                e("div", { class: "w-8 h-8 rounded-full bg-spa-goldNum text-white font-serif font-bold text-xs flex items-center justify-center" }, index + 1),
                                e("div", { class: "font-bold text-spa-textMain text-sm flex items-center gap-1.5" },
                                  isStarred && e("span", { class: "text-spa-goldBadge" }, "★"),
                                  tech.name
                                )
                              ),
                              e("div", { class: "flex items-center gap-2" },
                                e("button", {
                                  onClick: () => toggleStar(tech.id),
                                  class: `w-7 h-7 rounded-full border text-xs flex items-center justify-center transition cursor-pointer ${
                                    isStarred ? "bg-spa-goldBadge text-white border-spa-goldBadge" : "bg-white border-spa-cardBorder text-spa-textMuted"
                                  }`
                                }, "★"),

                                editingOrder && e("div", { class: "flex items-center gap-1" },
                                  e("button", {
                                    disabled: index === 0,
                                    onClick: () => moveTurnPosition(index, -1),
                                    class: "w-6 h-6 rounded bg-spa-bg border text-[10px] font-bold disabled:opacity-30 cursor-pointer"
                                  }, "↑"),
                                  e("button", {
                                    disabled: index === activeTurnTechnicians.length - 1,
                                    onClick: () => moveTurnPosition(index, 1),
                                    class: "w-6 h-6 rounded bg-spa-bg border text-[10px] font-bold disabled:opacity-30 cursor-pointer"
                                  }, "↓")
                                ),

                                e("button", {
                                  onClick: () => callTechnician(tech.id),
                                  class: "bg-spa-greenCall hover:bg-spa-greenHover text-white px-3 py-1.5 rounded-xl text-xs font-bold uppercase transition flex items-center gap-1 cursor-pointer"
                                }, e("i", { class: "fa-solid fa-phone text-[9px]" }), "CALL")
                              )
                            );
                          })
                        )
                  ),

                  e("div", { class: "pt-2 border-t border-spa-cardBorder flex items-center justify-between text-[11px] text-spa-textMuted" },
                    e("span", null, `${data.turnPosition.length} active`),
                    e("span", null, "Scroll for more")
                  )
                )
              )
            ),

            /* BOTTOM ACTION BUTTONS */
            e("div", { class: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-2" },
              e("div", {
                onClick: () => setShowHistoryModal(true),
                class: "bg-spa-card border border-spa-cardBorder p-3.5 rounded-2xl flex items-center justify-between hover:border-spa-purpleAdd transition cursor-pointer shadow-xs"
              },
                e("div", { class: "flex items-center gap-3" },
                  e("div", { class: "w-9 h-9 rounded-2xl bg-spa-purpleAdd/15 flex items-center justify-center text-spa-purpleAdd text-sm" }, e("i", { class: "fa-regular fa-clock" })),
                  e("div", null,
                    e("h4", { class: "font-serif text-xs font-bold text-spa-textMain" }, "Turn History"),
                    e("p", { class: "text-[10px] text-spa-textMuted" }, "View records")
                  )
                ),
                e("i", { class: "fa-solid fa-chevron-right text-[10px] text-spa-textMuted" })
              ),

              e("div", {
                onClick: undoLastCall,
                class: "bg-spa-card border border-spa-cardBorder p-3.5 rounded-2xl flex items-center justify-between hover:border-spa-purpleAdd transition cursor-pointer shadow-xs"
              },
                e("div", { class: "flex items-center gap-3" },
                  e("div", { class: "w-9 h-9 rounded-2xl bg-spa-purpleAdd/15 flex items-center justify-center text-spa-purpleAdd text-sm" }, e("i", { class: "fa-solid fa-rotate-left" })),
                  e("div", null,
                    e("h4", { class: "font-serif text-xs font-bold text-spa-textMain" }, "Undo"),
                    e("p", { class: "text-[10px] text-spa-textMuted" }, "Revert last action")
                  )
                ),
                e("i", { class: "fa-solid fa-chevron-right text-[10px] text-spa-textMuted" })
              ),

              e("div", {
                onClick: () => setConfirmNewDay(true),
                class: "bg-gradient-to-r from-spa-goldBadge to-spa-goldNum text-white border border-spa-goldBadge p-3.5 rounded-2xl flex items-center justify-between hover:opacity-95 transition cursor-pointer shadow-xs"
              },
                e("div", { class: "flex items-center gap-3" },
                  e("div", { class: "w-9 h-9 rounded-2xl bg-white/20 flex items-center justify-center text-white text-sm" }, e("i", { class: "fa-regular fa-sun" })),
                  e("div", null,
                    e("h4", { class: "font-serif text-xs font-bold text-white" }, "New Day"),
                    e("p", { class: "text-[10px] text-white/80" }, "Reset queue")
                  )
                ),
                e("i", { class: "fa-solid fa-chevron-right text-[10px] text-white/80" })
              ),

              e("div", {
                onClick: () => setShowArchiveModal(true),
                class: "bg-spa-card border border-spa-cardBorder p-3.5 rounded-2xl flex items-center justify-between hover:border-spa-purpleAdd transition cursor-pointer shadow-xs"
              },
                e("div", { class: "flex items-center gap-3" },
                  e("div", { class: "w-9 h-9 rounded-2xl bg-spa-purpleAdd/15 flex items-center justify-center text-spa-purpleAdd text-sm" }, e("i", { class: "fa-solid fa-box-archive" })),
                  e("div", null,
                    e("h4", { class: "font-serif text-xs font-bold text-spa-textMain" }, "Archive"),
                    e("p", { class: "text-[10px] text-spa-textMuted" }, "Past days")
                  )
                ),
                e("i", { class: "fa-solid fa-chevron-right text-[10px] text-spa-textMuted" })
              )
            )
          )
        ),

        /* MODALS */
        confirmNewDay && e("div", { class: "fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4" },
          e("div", { class: "bg-spa-card border border-spa-cardBorder rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-xl" },
            e("h3", { class: "font-serif text-lg font-bold text-spa-textMain" }, "Start A New Day?"),
            e("p", { class: "text-xs text-spa-textMuted" }, "Today's turn history will be archived before resetting."),
            e("div", { class: "flex gap-2 pt-2" },
              e("button", { onClick: startNewDay, class: "flex-1 py-2.5 bg-rose-600 text-white font-bold text-xs rounded-xl cursor-pointer" }, "Confirm Reset"),
              e("button", { onClick: () => setConfirmNewDay(false), class: "px-4 py-2.5 bg-white border border-spa-cardBorder text-spa-textMain font-semibold text-xs rounded-xl cursor-pointer" }, "Cancel")
            )
          )
        ),

        showHistoryModal && e("div", { class: "fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4" },
          e("div", { class: "bg-spa-card border border-spa-cardBorder rounded-3xl p-6 max-w-lg w-full space-y-4 shadow-xl max-h-[80vh] flex flex-col" },
            e("div", { class: "flex justify-between items-center pb-2 border-b border-spa-cardBorder" },
              e("h3", { class: "font-serif text-lg font-bold text-spa-textMain" }, "Daily Turn History"),
              e("button", { onClick: () => setShowHistoryModal(false), class: "text-spa-textMuted cursor-pointer" }, e("i", { class: "fa-solid fa-xmark text-lg" }))
            ),
            e("div", { class: "flex-1 overflow-y-auto space-y-2 pr-1 smooth-scroll" },
              data.history.length === 0
                ? e("p", { class: "text-xs text-spa-textMuted text-center py-6 italic" }, "No turn calls recorded today.")
                : [...data.history].reverse().map((entry) =>
                    e("div", { key: entry.id, class: "p-3 bg-white border border-spa-cardBorder rounded-xl flex justify-between items-center text-xs" },
                      e("span", { class: "font-serif font-bold text-spa-goldBadge" }, `#${entry.turnNo} ${entry.techName}`),
                      e("span", { class: "text-spa-textMuted font-mono" }, `${formatDate(entry.timestamp)} ${formatTime(entry.timestamp)}`)
                    )
                  )
            )
          )
        ),

        showArchiveModal && e("div", { class: "fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4" },
          e("div", { class: "bg-spa-card border border-spa-cardBorder rounded-3xl p-6 max-w-lg w-full space-y-4 shadow-xl max-h-[80vh] flex flex-col" },
            e("div", { class: "flex justify-between items-center pb-2 border-b border-spa-cardBorder" },
              e("h3", { class: "font-serif text-lg font-bold text-spa-textMain" }, "Past Day Archives"),
              e("button", { onClick: () => setShowArchiveModal(false), class: "text-spa-textMuted cursor-pointer" }, e("i", { class: "fa-solid fa-xmark text-lg" }))
            ),
            e("div", { class: "flex-1 overflow-y-auto space-y-2 pr-1 smooth-scroll" },
              archive.length === 0
                ? e("p", { class: "text-xs text-spa-textMuted text-center py-6 italic" }, "No archived records stored.")
                : archive.map((day) =>
                    e("details", { key: day.id, class: "group border border-spa-cardBorder rounded-xl bg-white overflow-hidden text-xs" },
                      e("summary", { class: "p-3 font-semibold text-spa-textMain cursor-pointer flex justify-between items-center group-open:bg-spa-bg" },
                        e("span", null, day.date),
                        e("span", { class: "text-[10px] px-2 py-0.5 rounded-full bg-spa-bg text-spa-goldBadge border" }, `${day.history?.length || 0} Calls`)
                      ),
                      e("div", { class: "p-3 bg-white border-t border-spa-cardBorder space-y-1" },
                        (day.history || []).map((h, i) =>
                          e("div", { key: i, class: "flex justify-between text-[11px] text-spa-textMuted py-0.5" },
                            e("span", null, `#${h.turnNo} ${h.techName}`),
                            e("span", { class: "font-mono" }, formatTime(h.timestamp))
                          )
                        )
                      )
                    )
                  )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(App));
  </script>
</body>
</html>
